name: Bug report
description: Report reproducible behavior that differs from the documentation or expected result.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: "Thank you for making the issue reproducible and specific."
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v1.2.3 or abc1234"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: "Remove tokens, private paths, and sensitive data before posting."
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: Can you help investigate or submit a fix?
      options:
        - "Yes"
        - "No"
        - "Maybe with guidance"
